<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZIYA FAMILY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: #111;
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 0 25px rgba(255,255,255,0.12);
    }

    .logo {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #fff;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      color: #bbb;
      font-size: 15px;
      margin-bottom: 22px;
    }

    .telegram-btn {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: #229ED9;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      transition: 0.2s;
    }

    .telegram-btn:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <!-- ZIYA FAMILY PHOTO -->
      <img
        class="logo"
        src="https://i.ibb.co/ym8m8DLD/x.jpg"
        alt="ZIYA FAMILY"
      >

      <!-- NAME -->
      <h1>ZIYA FAMILY</h1>

      <p>Join our official Telegram channel</p>

      <!-- TELEGRAM LINK -->
      <a
        class="telegram-btn"
        href="https://t.me/+XNIlSVplmto3NWJl"
        target="_blank"
        rel="noopener noreferrer"
      >
        JOIN TELEGRAM
      </a>

    </div>
  </div>

</body>
</html>
