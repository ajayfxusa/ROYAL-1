<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZIYA FAMILY Official</title>

  <meta name="author" content="ZIYA FAMILY">
  <meta name="description" content="Join the official ZIYA FAMILY Telegram channel.">

  <meta property="og:title" content="ZIYA FAMILY Official">
  <meta property="og:description" content="Join the official ZIYA FAMILY Telegram channel.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://i.ibb.co/ym8m8DLD/x.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ZIYA FAMILY Official">
  <meta name="twitter:description" content="Join the official ZIYA FAMILY Telegram channel.">
  <meta name="twitter:image" content="https://i.ibb.co/ym8m8DLD/x.jpg">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #050505;
      color: #f7f3e9;
      font-family: Inter, Arial, sans-serif;
      overflow: hidden;
    }

    .landing-shell {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at center,
          rgba(126, 91, 22, 0.18) 0%,
          rgba(20, 16, 8, 0.30) 35%,
          #050505 75%
        );
    }

    /* Background light beams */

    .light-beam {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      width: 45vw;
      height: 120vh;
      top: -10vh;
      opacity: 0.25;
      filter: blur(45px);
      transform: rotate(18deg);
    }

    .light-beam-left {
      left: -30vw;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 190, 70, 0.20),
        transparent
      );
    }

    .light-beam-right {
      right: -30vw;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 190, 70, 0.20),
        transparent
      );
      transform: rotate(-18deg);
    }

    .gold-haze {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      width: 600px;
      height: 400px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        ellipse,
        rgba(218, 169, 66, 0.12) 0%,
        rgba(218, 169, 66, 0.04) 35%,
        transparent 70%
      );
      filter: blur(30px);
    }

    /* Main content */

    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 768px;
      height: 100%;
      margin: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Brand mark */

    .brand-mark {
      margin-bottom: 24px;
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(218, 169, 66, 0.55);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.025);
      box-shadow:
        0 0 20px rgba(218, 169, 66, 0.12),
        inset 0 0 18px rgba(218, 169, 66, 0.05);
    }

    .brand-mark span {
      color: #e5bd61;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    /* Portrait */

    .portrait-wrap {
      position: relative;
      width: 190px;
      height: 190px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portrait-orbit {
      position: absolute;
      inset: -9px;
      border-radius: 50%;
      border: 1px solid rgba(218, 169, 66, 0.45);
      box-shadow:
        0 0 20px rgba(218, 169, 66, 0.15),
        0 0 50px rgba(218, 169, 66, 0.06);
      animation: rotateOrbit 12s linear infinite;
    }

    .portrait-orbit::before {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e7bf64;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 12px #e7bf64;
    }

    .portrait-image {
      position: relative;
      z-index: 2;
      width: 172px;
      height: 172px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(231, 191, 100, 0.75);
      box-shadow:
        0 0 30px rgba(218, 169, 66, 0.18),
        0 0 80px rgba(218, 169, 66, 0.08);
      background: #111;
    }

    @keyframes rotateOrbit {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* Text */

    .subtitle {
      margin-bottom: 12px;
      color: #c8a75b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      color: #f8f5ed;
      font-size: clamp(42px, 10vw, 72px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -2px;
      text-transform: uppercase;
    }

    h1 .gold {
      color: #dfb657;
    }

    .description {
      max-width: 430px;
      margin-top: 18px;
      color: #9b988f;
      font-size: 14px;
      line-height: 1.7;
    }

    /* Telegram button */

    .telegram-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      min-width: 245px;
      height: 72px;
      margin-top: 32px;
      padding: 0 42px;
      border: 1px solid rgba(255, 220, 130, 0.45);
      border-radius: 8px;
      background:
        linear-gradient(
          135deg,
          #d6a83f 0%,
          #f0cb70 50%,
          #b98624 100%
        );
      color: #171207;
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow:
        0 10px 35px rgba(218, 169, 66, 0.15),
        inset 0 1px 0 rgba(255,255,255,0.35);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .telegram-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 15px 45px rgba(218, 169, 66, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .telegram-button:active {
      transform: scale(0.98);
    }

    .telegram-icon {
      width: 29px;
      height: 29px;
      fill: currentColor;
    }

    /* Bottom status */

    .status {
      margin-top: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #77746d;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #68c77b;
      box-shadow: 0 0 10px rgba(104, 199, 123, 0.65);
    }

    .line {
      width: 28px;
      height: 1px;
      background: #34322d;
    }

    /* Mobile */

    @media (max-width: 600px) {

      .content {
        padding: 25px 18px;
      }

      .brand-mark {
        width: 50px;
        height: 50px;
        margin-bottom: 18px;
      }

      .portrait-wrap {
        width: 165px;
        height: 165px;
        margin-bottom: 20px;
      }

      .portrait-image {
        width: 150px;
        height: 150px;
      }

      .subtitle {
        font-size: 10px;
        letter-spacing: 1.7px;
      }

      h1 {
        font-size: 43px;
      }

      .description {
        font-size: 13px;
        margin-top: 15px;
      }

      .telegram-button {
        width: 100%;
        max-width: 310px;
        height: 64px;
        margin-top: 26px;
        font-size: 16px;
        padding: 0 28px;
      }

      .status {
        margin-top: 24px;
        font-size: 9px;
      }
    }

    @media (max-height: 700px) {

      .content {
        padding-top: 15px;
        padding-bottom: 15px;
      }

      .brand-mark {
        margin-bottom: 12px;
      }

      .portrait-wrap {
        width: 145px;
        height: 145px;
        margin-bottom: 15px;
      }

      .portrait-image {
        width: 132px;
        height: 132px;
      }

      .telegram-button {
        margin-top: 20px;
        height: 58px;
      }

      .status {
        margin-top: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="landing-shell">

    <div class="light-beam light-beam-left"></div>
    <div class="light-beam light-beam-right"></div>
    <div class="gold-haze"></div>

    <div class="content">

      <!-- Brand -->
      <div class="brand-mark" aria-hidden="true">
        <span>ZF</span>
      </div>

      <!-- Profile Image -->
      <div class="portrait-wrap">

        <div class="portrait-orbit" aria-hidden="true"></div>

        <img
          class="portrait-image"
          src="https://i.ibb.co/ym8m8DLD/x.jpg"
          alt="ZIYA FAMILY"
        >

      </div>

      <!-- Subtitle -->
      <p class="subtitle">
        The official community
      </p>

      <!-- Main Title -->
      <h1>
        ZIYA <span class="gold">FAMILY</span>
      </h1>

      <!-- Description -->
      <p class="description">
        Smart updates. Fast support. One powerful community.
      </p>

      <!-- Telegram -->
      <a
        class="telegram-button"
        href="https://t.me/+XNIlSVplmto3NWJl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Join ZIYA FAMILY on Telegram"
      >

        <svg
          class="telegram-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M21.94 3.2c.29-1.2-.46-1.67-1.32-1.34L2.7 8.77c-1.22.48-1.2 1.16-.21 1.46l4.6 1.44 10.67-6.73c.5-.31.97-.14.59.2l-8.65 7.8-.33 4.67c.48 0 .69-.22.96-.48l2.3-2.23 4.78 3.53c.88.49 1.51.24 1.74-.82L21.94 3.2Z"/>
        </svg>

        Join Telegram

      </a>

      <!-- Status -->
      <div class="status">

        <span class="status-dot"></span>

        <span>Official channel</span>

        <span class="line"></span>

        <span>Stay connected</span>

      </div>

    </div>

  </main>

</body>
</html>
